<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bosch-tørketromler i Norge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Public+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: samme familie som «Sofaer i Norge» – header med målskisse sett forfra, oppsummering, sticky filterpanel, rutenett av produktkort. Én kort per modell med pris fra hver butikk. Kjølig stålblå som aksent. */
:root{
  --bg:#F1F2F3; --surface:#FFFFFF; --ink:#1F2328; --muted:#626A73; --line:#DADDE1;
  --steel:#8D9DAE; --steel-soft:#E3E8EE; --accent:#3D5A78; --sale:#B23A2B; --chip:#E7E9EC; --ok:#2F6B45; --ok-bg:#E3EFE6;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#16181B; --surface:#1F2226; --ink:#E9EBEE; --muted:#9EA6AF; --line:#33383E;
    --steel:#64778B; --steel-soft:#252D36; --accent:#A5BEDA; --sale:#F08A7A; --chip:#2A2E33; --ok:#8FD0A4; --ok-bg:#1F3326;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#16181B; --surface:#1F2226; --ink:#E9EBEE; --muted:#9EA6AF; --line:#33383E;
  --steel:#64778B; --steel-soft:#252D36; --accent:#A5BEDA; --sale:#F08A7A; --chip:#2A2E33; --ok:#8FD0A4; --ok-bg:#1F3326;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;padding-inline:clamp(16px,4vw,48px);padding-block:32px 64px}
.wrap{max-width:1360px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
h1{font-family:"Newsreader",Georgia,"Times New Roman",serif;font-weight:600;text-wrap:balance;margin:0;letter-spacing:-.01em;font-size:clamp(2rem,4.5vw,3.1rem);line-height:1.05}
header{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:end}
header p{margin:10px 0 0;max-width:62ch;color:var(--muted)}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:6px}
.spec{color:var(--muted)}
.spec svg{display:block;max-width:100%;height:auto}
.summary{display:flex;flex-wrap:wrap;gap:10px 28px;font-size:.9rem;color:var(--muted);font-variant-numeric:tabular-nums}
.summary b{color:var(--ink);font-weight:600}
.controls{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:center;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.group{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-width:0}
.group>span.lbl{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:4px}
.group.wide{width:100%}
.chip{font:inherit;font-size:.85rem;border:1px solid var(--line);background:var(--chip);color:var(--ink);padding:4px 11px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .c{opacity:.6;margin-left:4px;font-size:.78rem;font-variant-numeric:tabular-nums}
.chip:focus-visible,select:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
select,input[type=search]{font:inherit;font-size:.88rem;padding:6px 9px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);min-width:0}
input[type=search]{flex:1 1 220px}
input[type=range]{accent-color:var(--accent);width:130px}
label.tog{display:flex;gap:7px;align-items:center;font-size:.88rem;cursor:pointer}
input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px}
.num{font-variant-numeric:tabular-nums;min-width:6.5ch;font-size:.88rem}
details.more{width:100%}
details.more>summary{cursor:pointer;font-size:.82rem;color:var(--muted);list-style:none}
details.more>summary::before{content:"+ "}
details.more[open]>summary::before{content:"− "}
details.more>.inner{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:grid;grid-template-rows:auto 1fr;min-width:0}
.card .img{display:block;aspect-ratio:4/3;background:#fff;max-width:100%;overflow:hidden;position:relative}
.card .img img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:10px}
.card .img .none{position:absolute;inset:0;display:grid;place-items:center;color:#8a8d84;font-size:.8rem}
.card .img .ser{position:absolute;left:8px;top:8px;font-size:.72rem;font-weight:600;letter-spacing:.04em;padding:2px 9px;border-radius:999px;background:var(--accent);color:var(--surface)}
.card .b{padding:12px 13px 13px;display:flex;flex-direction:column;gap:6px;min-width:0}
.card .b .foot{margin-top:auto}
.model{font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);font-weight:600;font-variant-numeric:tabular-nums}
.model a{color:inherit;text-decoration:none}
.model a:hover{text-decoration:underline}
.twins{font-size:.76rem;color:var(--muted)}
.twins button{font:inherit;color:var(--accent);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-decoration-color:var(--line)}
.name{font-weight:600;font-size:.94rem;line-height:1.3;overflow-wrap:anywhere}
.name a{color:var(--ink);text-decoration:none}
.name a:hover{text-decoration:underline;text-decoration-color:var(--accent)}
.dims{font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.dims b{color:var(--ink);font-weight:600}
.meta{display:flex;flex-wrap:wrap;gap:4px;align-content:start}
.pill{font-size:.72rem;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--chip);color:var(--muted);white-space:nowrap}
.pill.type{background:var(--steel-soft);color:var(--accent)}
.pill.fn{background:var(--ok-bg);color:var(--ok)}
.offers{list-style:none;margin:0;padding:0;display:grid;gap:3px;font-size:.84rem;font-variant-numeric:tabular-nums;align-content:start}
.offers li{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.offers li a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.offers li a:hover{color:var(--accent);border-color:var(--accent)}
.offers li .p{white-space:nowrap}
.offers li .p.onsale{color:var(--sale)}
.offers li.best a{font-weight:600}
.offers li.off{opacity:.55}
.offers .tag{font-size:.7rem;color:var(--muted);margin-left:4px}
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:2px 8px;padding-top:8px;border-top:1px solid var(--line)}
.foot>span:first-child{white-space:nowrap}
.price{font-weight:600;font-size:1.02rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.price.onsale{color:var(--sale)}
.from{font-size:.76rem;color:var(--muted);font-weight:400;margin-right:3px}
.was{font-size:.8rem;color:var(--muted);text-decoration:line-through;margin-left:5px;font-variant-numeric:tabular-nums}
.spread{font-size:.76rem;color:var(--muted);white-space:nowrap}
a.buy{font-size:.82rem;color:var(--ink);text-decoration:none;border-bottom:1px solid var(--steel);white-space:nowrap}
a.buy:hover{color:var(--accent)}
.empty{padding:40px;text-align:center;color:var(--muted)}
footer{font-size:.82rem;color:var(--muted);max-width:80ch;display:flex;flex-direction:column;gap:6px}
footer p{margin:0}
@media (max-width:760px){header{grid-template-columns:1fr}.controls{position:static}.grid{grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}input[type=range]{width:110px}}
@media (prefers-reduced-motion:no-preference){.chip{transition:background .15s,color .15s}}
</style>
</head>

<div class="wrap">
  <a href="../" style="font-size:.85rem;color:var(--muted);text-decoration:none;align-self:flex-start">← Oversikten</a>
  <header>
    <div>
      <div class="eyebrow" id="eyebrow"></div>
      <h1>Bosch-tørketromler i norske nettbutikker</h1>
      <p id="lede"></p>
    </div>
    <div class="spec" aria-hidden="true">
      <svg width="220" height="170" viewBox="0 0 220 170" font-family="Public Sans, system-ui, sans-serif">
        <!-- tørketrommel sett forfra, 1,4 px = 1 cm: 60 x 85 -->
        <rect x="40" y="10" width="84" height="119" rx="5" fill="var(--steel-soft)" stroke="var(--steel)"/>
        <rect x="40" y="10" width="84" height="20" rx="4" fill="var(--steel)"/>
        <rect x="48" y="16" width="26" height="8" rx="2" fill="var(--steel-soft)"/>
        <circle cx="110" cy="20" r="5" fill="var(--steel-soft)"/>
        <circle cx="82" cy="78" r="31" fill="none" stroke="var(--steel)" stroke-width="5"/>
        <circle cx="82" cy="78" r="23" fill="var(--surface)" stroke="var(--steel)" stroke-dasharray="3 3"/>
        <line x1="40" y1="143" x2="124" y2="143" stroke="currentColor"/>
        <line x1="40" y1="138" x2="40" y2="148" stroke="currentColor"/><line x1="124" y1="138" x2="124" y2="148" stroke="currentColor"/>
        <text x="82" y="162" text-anchor="middle" font-size="11" fill="currentColor">bredde 60 cm</text>
        <line x1="26" y1="10" x2="26" y2="129" stroke="currentColor"/>
        <line x1="22" y1="10" x2="30" y2="10" stroke="currentColor"/><line x1="22" y1="129" x2="30" y2="129" stroke="currentColor"/>
        <text x="0" y="0" font-size="11" fill="currentColor" text-anchor="middle" transform="translate(16 70) rotate(-90)">høyde 85</text>
        <text x="136" y="64" font-size="11" fill="currentColor">dybde</text>
        <text x="136" y="78" font-size="11" fill="currentColor">ca. 60–65</text>
        <text x="136" y="92" font-size="11" fill="currentColor">+ dør</text>
      </svg>
    </div>
  </header>

  <div class="summary" id="summary"></div>

  <div class="controls" role="search">
    <input type="search" id="q" placeholder="Søk etter modellkode eller funksjon" aria-label="Søk">
    <div class="group"><span class="lbl">Sorter</span>
      <select id="sort" aria-label="Sortering">
        <option value="price-asc">Pris, lav til høy</option>
        <option value="price-desc">Pris, høy til lav</option>
        <option value="sale">Største rabatt</option>
        <option value="spread">Størst prisforskjell mellom butikker</option>
        <option value="kg-desc">Kapasitet, størst først</option>
        <option value="noise-asc">Lydnivå, stillest først</option>
        <option value="energy">Energiklasse, best først</option>
        <option value="series">Serie, 8 til 2</option>
        <option value="name">Modellkode A–Å</option>
      </select>
    </div>
    <label class="group" for="max"><span class="lbl">Maks pris</span><input type="range" id="max" min="0" max="100" step="1" value="100"> <span class="num" id="maxv"></span></label>
    <div class="group wide" id="series"><span class="lbl">Serie</span></div>
    <details class="more" id="moreFilters">
      <summary>Flere filtre: type, kapasitet, funksjoner og butikk</summary>
      <div class="inner">
        <div class="group" id="types"><span class="lbl">Type</span></div>
        <div class="group" id="kgs"><span class="lbl">Kapasitet</span></div>
        <div class="group"><span class="lbl">Funksjoner</span>
          <label class="tog"><input type="checkbox" id="hc"> Home Connect</label>
          <label class="tog"><input type="checkbox" id="selfclean"> Selvrensende kondensator</label>
          <label class="tog"><input type="checkbox" id="multi"> Finnes i flere butikker</label>
          <label class="tog"><input type="checkbox" id="saleOnly"> Kun tilbud</label>
          <label class="tog"><input type="checkbox" id="stockOnly"> Kun på lager</label>
        </div>
        <div class="group" id="stores"><span class="lbl">Butikk</span></div>
      </div>
    </details>
  </div>

  <div class="grid" id="grid"></div>
  <p class="empty" id="empty" hidden>Ingen tørketromler passer filtrene. Prøv å øke makspris, eller velg flere serier eller butikker.</p>

  <footer id="foot"></footer>
</div>

const NOTES = "<p><b>Om dataene.<\/b> Priser er hentet fra butikkenes egne nettsider 18. oktober 2026. Serie, kapasitet, energiklasse, lydnivå og utstyr er hentet fra Bosch sine egne produktsider (bosch-home.no). Prisene endrer seg ofte, så sjekk alltid produktsiden før du kjøper.<\/p>\n<p><b>Tilbud.<\/b> Overstreket pris er butikkens egen førpris. Bosch har en cashback-kampanje 15.10.2026–15.01.2027 (hos NetOnNet oppgitt som 500 kr ved kjøp fra 7 490 kr og 800 kr fra 10 990 kr). Cashback og «kjøp for X, få Y»-tilbud er ikke trukket fra prisen. Outlet- og demovarer er ikke med.<\/p>\n<p><b>Lager.<\/b> «Ikke på lager» betyr at butikken ikke har varen på nettlager i dag. Mange av dem har forventet dato for påfyll, og noen har den i fysiske butikker.<\/p>\n<p><b>Energiklasse.<\/b> Fra 1. juli 2025 bruker tørketromler en ny EU-energimerking med skala A–G. Klassene kan derfor ikke sammenlignes direkte med gamle merker som A+++. WTH8307LSN hos Elon er en eldre modell som bare har gammel merking. Alle Bosch-tørketromler som selges i Norge i dag har varmepumpe.<\/p>\n<p><b>«Samme spesifikasjoner som».<\/b> Viser modeller der Bosch oppgir samme kapasitet, energiklasse, lydnivå og utstyrsliste. Farge, design på panelet og programnavn kan likevel avvike.<\/p>\n<p><b>Butikker.<\/b> Skousen, Tretti og Whiteaway er samme konsern og har stort sett samme utvalg, men egne kampanjepriser. Elon er Euronics-kjeden i Norge. «Bosch Home» er Boschs egen nettbutikk på bosch-home.no. Proshop selger ikke tørketromler og er ikke med.<\/p>\n";
const LEDE = "Bosch-tørketromler fra Elkjøp, Power, Komplett, NetOnNet, Skousen, Tretti, Whiteaway, Bygghjemme, Elon og Boschs egen nettbutikk, samlet på ett sted med bilde, serie og pris. Hver modell vises én gang, med prisen hos alle butikkene som har den. Bosch lager ofte nesten like modeller med én bokstav forskjell i modellkoden for hver butikkjede. Lenken «Samme spesifikasjoner som» viser slike tvillinger, så du kan sammenligne pris på tvers.";
const SERIES = [["Serie 8","Serie 8"],["Serie 6","Serie 6"],["Serie 4","Serie 4"],["Serie 2","Serie 2"],["ukjent","Ukjent serie"]];
const SERIES_LABEL = Object.fromEntries(SERIES);
const TYPES = [["varmepumpe","Varmepumpe"],["kondens","Kondens"],["ventilert","Ventilert"],["ukjent","Ukjent type"]];
const TYPE_LABEL = Object.fromEntries(TYPES);
const fmt = n => Math.round(n).toLocaleString("nb-NO") + " kr";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const dec = n => String(n).replace(".", ",");

ITEMS.forEach((it, i) => {
  it.i = i;
  if (!SERIES_LABEL[it.series]) it.series = "ukjent";
  if (!TYPE_LABEL[it.type]) it.type = "ukjent";
  it.kg = it.capacity_kg ? String(it.capacity_kg) : "ukjent";
  const f = (it.features || []).join(" ");
  it.hc = /home ?connect/i.test(f);

  it.offers.forEach(o => o.disc = o.price_original_nok && o.price_original_nok > o.price_nok ? 1 - o.price_nok / o.price_original_nok : 0);
  it.hay = [it.model, it.name, SERIES_LABEL[it.series], TYPE_LABEL[it.type], it.energy_class, f, it.offers.map(o => o.store).join(" ")].filter(Boolean).join(" ").toLowerCase();
});

const stores = [...new Set(ITEMS.flatMap(i => i.offers.map(o => o.store)))].sort((a, b) => a.localeCompare(b, "nb"));
const activeStores = new Set(stores);
const seriesPresent = SERIES.filter(([k]) => ITEMS.some(i => i.series === k)).map(([k]) => k);
const activeSeries = new Set(seriesPresent);

const activeTypes = new Set(typesPresent);

function chipRow(boxId, keys, active, label, count) {
  const box = $(boxId);
  box.innerHTML = `<span class="lbl">${label}</span>`;
  const all = document.createElement("button");
  all.className = "chip"; all.type = "button"; all.textContent = "Alle";
  all.setAttribute("aria-pressed", active.size === keys.length);
  all.onclick = () => { if (active.size === keys.length) active.clear(); else keys.forEach(k => active.add(k)); chipRow(boxId, keys, active, label, count); render(); };
  box.appendChild(all);
  keys.forEach(k => {
    const b = document.createElement("button");
    b.className = "chip"; b.type = "button";
    b.setAttribute("aria-pressed", active.has(k));
    b.innerHTML = `${esc(count.label(k))}<span class="c">${count.n(k)}</span>`;
    b.onclick = () => { active.has(k) ? active.delete(k) : active.add(k); chipRow(boxId, keys, active, label, count); render(); };
    box.appendChild(b);
  });
}

function specLine(it) {
  const p = [];
  if (it.capacity_kg) p.push(`<b>${dec(it.capacity_kg)} kg</b>`);
  if (it.energy_class) p.push(`energi ${esc(it.energy_class)}`);
  if (it.noise_db) p.push(`${it.noise_db} dB`);
  const d = [it.width_cm, it.depth_cm, it.height_cm].every(Boolean) ? `<div class="dims">B ${dec(it.width_cm)} × D ${dec(it.depth_cm)} × H ${dec(it.height_cm)} cm</div>` : `<div class="dims">Mål ikke oppgitt</div>`;
  return `<div class="dims">${p.join(" · ") || "Spesifikasjoner ikke oppgitt"}</div>${d}`;
}
function card(it, offers) {
  const img = it.thumb ? `<img src="${it.thumb}" alt="${esc(it.model)}" loading="lazy" decoding="async">` : `<span class="none">Bilde mangler</span>`;
  const best = offers[0];
  const tags = [`<span class="pill type">${esc(TYPE_LABEL[it.type])}</span>`];
  if (it.hc) tags.push(`<span class="pill fn">Home Connect</span>`);
  if (it.selfclean) tags.push(`<span class="pill fn">selvrensende kondensator</span>`);
  (it.features || []).filter(f => !/home ?connect|selfclean|selvrens|autodry/i.test(f)).slice(0, 3).forEach(f => tags.push(`<span class="pill">${esc(f)}</span>`));
  const twins = (it.twins || []).filter(m => ITEMS.some(o => o.model === m));
  const twinTxt = twins.length ? `<div class="twins">Samme spesifikasjoner som ${twins.map(m => `<button type="button" data-q="${esc(m)}">${esc(m)}</button>`).join(", ")}</div>` : "";
  const hidden = it.offers.filter(o => !offers.includes(o));
  const row = (o, cls) => `<li class="${cls}"><a href="${esc(o.url)}" target="_blank" rel="noopener">${esc(o.store)}</a><span class="p${o.disc > 0 ? " onsale" : ""}">${fmt(o.price_nok)}${o.member_price ? `<span class="tag">medlem</span>` : ""}${o.in_stock === false ? `<span class="tag">ikke på lager</span>` : ""}</span></li>`;
  const list = offers.map((o, j) => row(o, j === 0 ? "best" : "")).concat(hidden.map(o => row(o, "off"))).join("");
  const spread = offers.length > 1 ? offers[offers.length - 1].price_nok - best.price_nok : 0;
  const sale = best.disc > 0;
  return `<article class="card">
    <a class="img" href="${esc(best.url)}" target="_blank" rel="noopener" tabindex="-1" aria-hidden="true">${img}${it.series !== "ukjent" ? `<span class="ser">${esc(it.series)}</span>` : ""}</a>
    <div class="b">
      <span class="model">${it.bosch_url ? `<a href="${esc(it.bosch_url)}" target="_blank" rel="noopener" title="Produktside hos Bosch">${esc(it.model)}</a>` : esc(it.model)}</span>
      <span class="name"><a href="${esc(best.url)}" target="_blank" rel="noopener">${esc(it.name)}</a></span>
      ${specLine(it)}
      <div class="meta">${tags.join("")}</div>
      ${twinTxt}
      <ul class="offers">${list}</ul>
      <div class="foot">
        <span>${offers.length > 1 ? `<span class="from">fra</span>` : ""}<span class="price${sale ? " onsale" : ""}">${fmt(best.price_nok)}</span>${sale ? `<span class="was">${fmt(best.price_original_nok)}</span>` : ""}</span>
        ${spread > 0 ? `<span class="spread">opptil ${fmt(spread)} forskjell</span>` : `<a class="buy" href="${esc(best.url)}" target="_blank" rel="noopener">Til ${esc(best.store)}</a>`}
      </div>
    </div>
  </article>`;
}

function render() {
  const q = $("q").value.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const pmax = PSTEPS[+$("max").value];
  const pAll = +$("max").value === PSTEPS.length - 1;
  $("maxv").textContent = pAll ? "ingen" : fmt(pmax);
  const hc = $("hc").checked, sc = $("selfclean").checked, mu = $("multi").checked, so = $("saleOnly").checked, st = $("stockOnly").checked;
  const rows = [];
  for (const it of ITEMS) {
    if (!activeSeries.has(it.series) || !activeTypes.has(it.type) || !activeKgs.has(it.kg)) continue;
    if ((hc && !it.hc) || (sc && !it.selfclean) || !q.every(w => it.hay.includes(w))) continue;
    const offers = it.offers.filter(o => activeStores.has(o.store) && (!st || o.in_stock !== false)).sort((a, b) => a.price_nok - b.price_nok);
    if (!offers.length || (mu && it.offers.length < 2)) continue;
    if (!pAll && offers[0].price_nok > pmax) continue;
    if (so && !offers.some(o => o.disc > 0)) continue;
    rows.push({ it, offers, price: offers[0].price_nok, disc: Math.max(...offers.map(o => o.disc)), spread: offers[offers.length - 1].price_nok - offers[0].price_nok });
  }
  const ek = it => !it.energy_class || /gml/.test(it.energy_class) ? "Z" : it.energy_class;
  const sn = s => s === "ukjent" ? 0 : +s.slice(-1);
  const by = {
    "price-asc": (a, b) => a.price - b.price,
    "price-desc": (a, b) => b.price - a.price,
    "sale": (a, b) => b.disc - a.disc || a.price - b.price,
    "spread": (a, b) => b.spread - a.spread || a.price - b.price,
    "kg-desc": (a, b) => (b.it.capacity_kg ?? 0) - (a.it.capacity_kg ?? 0) || a.price - b.price,
    "noise-asc": (a, b) => (a.it.noise_db ?? 99) - (b.it.noise_db ?? 99) || a.price - b.price,
    "energy": (a, b) => ek(a.it).localeCompare(ek(b.it)) || a.price - b.price,
    "series": (a, b) => sn(b.it.series) - sn(a.it.series) || a.price - b.price,
    "name": (a, b) => a.it.model.localeCompare(b.it.model, "nb"),
  }[$("sort").value];
  rows.sort(by);
  $("grid").innerHTML = rows.map(r => card(r.it, r.offers)).join("");
  $("empty").hidden = rows.length > 0;
  const cheapest = rows.length ? Math.min(...rows.map(r => r.price)) : null;
  const nOffers = rows.reduce((s, r) => s + r.offers.length, 0);
  $("summary").innerHTML = `<span>Viser <b>${rows.length}</b> av <b>${ITEMS.length}</b> modeller</span><span><b>${nOffers}</b> butikkpriser</span><span><b>${new Set(rows.flatMap(r => r.offers.map(o => o.store))).size}</b> butikker</span>` + (cheapest != null ? `<span>Billigste <b>${fmt(cheapest)}</b></span>` : "") + `<span><b>${rows.filter(r => r.disc > 0).length}</b> på tilbud</span>`;
}

$("grid").addEventListener("click", e => { const b = e.target.closest("button[data-q]"); if (b) { $("q").value = b.dataset.q; render(); $("q").scrollIntoView({ block: "nearest" }); } });
["q", "sort", "max", "hc", "selfclean", "multi", "saleOnly", "stockOnly"].forEach(id => $(id).addEventListener("input", render));
$("eyebrow").textContent = `Tørketromler · ${stores.length} butikker · ${ITEMS.length} modeller`;
$("lede").textContent = LEDE;
$("foot").innerHTML = NOTES;
chipRow("series", seriesPresent, activeSeries, "Serie", { label: k => SERIES_LABEL[k], n: k => ITEMS.filter(i => i.series === k).length });
chipRow("types", typesPresent, activeTypes, "Type", { label: k => TYPE_LABEL[k], n: k => ITEMS.filter(i => i.type === k).length });
chipRow("kgs", kgsPresent, activeKgs, "Kapasitet", { label: k => k === "ukjent" ? "Ukjent" : dec(k) + " kg", n: k => ITEMS.filter(i => i.kg === k).length });
chipRow("stores", stores, activeStores, "Butikk", { label: k => k, n: k => ITEMS.filter(i => i.offers.some(o => o.store === k)).length });
render();
</script>
</body>
</html>
